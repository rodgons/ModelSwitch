# Continuous integration (docs/conventions.md "CI"). CodeQL runs in codeql.yml.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore ModelSwitch.slnx
      - name: Format
        run: dotnet format ModelSwitch.slnx --no-restore --verify-no-changes
      - name: Build
        run: dotnet build ModelSwitch.slnx -c Release --no-restore
      - name: Test
        # Docker is available on ubuntu runners for the Testcontainers-based projects.
        run: dotnet test ModelSwitch.slnx -c Release --no-build

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package-json-file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      # The generated client must match web/openapi.json, which OpenApiDocumentTests keeps equal to the served document.
      - run: pnpm check:api
      - run: pnpm test
      - run: pnpm build

  images:
    # The Compose images (docs/deployment.md section 1) must keep building. Built only, never pushed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the .NET images
        # One Dockerfile, one target per process; the targets share the restore and publish stage.
        run: |
          for target in api worker migrator mock-provider; do
            docker build -f deploy/docker/dotnet.Dockerfile --target "$target" -t "modelswitch/$target:ci" .
          done
      - name: Build the web image
        run: docker build -f deploy/docker/web.Dockerfile -t modelswitch/web:ci .
      - name: Check the Compose file
        run: |
          cp .env.example .env
          ./scripts/generate-secrets.sh
          docker compose --profile demo --profile ollama config --quiet
      - name: Lint the scripts
        run: shellcheck scripts/generate-secrets.sh scripts/seed-demo.sh

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
