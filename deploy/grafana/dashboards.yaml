# Grafana dashboard provider for the otel-lgtm container (docs/observability.md section 6).
apiVersion: 1
providers:
  - name: modelswitch
    folder: ModelSwitch
    type: file
    disableDeletion: true
    allowUiUpdates: false
    options:
      path: /otel-lgtm/grafana/conf/provisioning/dashboards/modelswitch
